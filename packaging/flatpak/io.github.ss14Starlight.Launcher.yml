id: io.github.ss14Starlight.Launcher
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: starlight-launcher

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-run/discord-ipc-0
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-2-0
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --own-name=org.kde.StatusNotifierItem-2-2
  - --talk-name=org.freedesktop.Flatpak

modules:
  - name: dotnet-runtime
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/dotnet
      - cp -a . /app/lib/dotnet/
    sources:
      - type: archive
        url: https://builds.dotnet.microsoft.com/dotnet/aspnetcore/Runtime/10.0.12/aspnetcore-runtime-10.0.12-linux-x64.tar.gz
        sha512: c489fc3a9dcc85f24f2d52e9a81b46fdf51affc8a360d008dbd5e3b7ce524969adc4a54f555ad13e29b822f59ed1cae9785608cbac2282f2c9c4fda45c21c7d1
        strip-components: 0

  - name: starlight-launcher
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/starlight-launcher
      - cp -a publish/. /app/lib/starlight-launcher/
      - chmod +x /app/lib/starlight-launcher/Starlight.Launcher /app/lib/starlight-launcher/loader/Robust.Loader
      - echo flatpak > /app/lib/starlight-launcher/install-kind
      - install -Dm755 starlight-launcher.sh /app/bin/starlight-launcher
      - install -Dm644 icon.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ../../publish/linux-x64
        dest: publish
      - type: file
        path: starlight-launcher.sh
      - type: file
        path: ../../PublishFiles/icon.png
      - type: file
        path: io.github.ss14Starlight.Launcher.desktop
      - type: file
        path: io.github.ss14Starlight.Launcher.metainfo.xml
